<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Himalayan Game Battle - Chudapatti</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div class="game-container">
    <header>
      <h1>🏔️ Himalayan Game Battle (Chudapatti)</h1>
      <div id="game-status">Enter Room & Name to Begin</div>
    </header>

    <div id="auth-panel" class="panel">
      <input type="text" id="username" placeholder="Your Name" />
      <input type="text" id="room-id" placeholder="Room ID (e.g. room101)" />
      <button id="btn-join">Join Room</button>
      <button id="btn-start" style="display:none;">Start Game</button>
    </div>

    <div id="timer-container" style="display: none;">
      <div class="timer-meta">
        <span>⏱️ Turn Timer</span>
        <span id="timer-text">30s</span>
      </div>
      <div class="timer-track">
        <div id="timer-bar"></div>
      </div>
    </div>

    <div id="table-area" class="panel" style="display:none;">
      <div class="table-info">
        <div><strong>Center Pile:</strong> <span id="pile-count">0</span> cards</div>
        <div><strong>Current Claim:</strong> <span id="current-claim">None</span></div>
        <div><strong>Current Turn:</strong> <span id="current-turn">-</span></div>
      </div>
      <div id="last-action-box"></div>
      
      <div class="actions">
        <select id="claim-select">
          <option value="2">2</option><option value="3">3</option><option value="4">4</option>
          <option value="5">5</option><option value="6">6</option><option value="7">7</option>
          <option value="8">8</option><option value="9">9</option><option value="10">10</option>
          <option value="J">J</option><option value="Q">Q</option><option value="K">K</option>
          <option value="A">A</option>
        </select>
        <button id="btn-play">Play Selected Cards</button>
        <button id="btn-challenge" class="btn-danger">BLUFF / CHALLENGE!</button>
      </div>
    </div>

    <div id="player-hand-container" style="display:none;">
      <h3>Your Hand (<span id="hand-count">0</span>)</h3>
      <div id="hand" class="cards-flex"></div>
    </div>

    <div id="players-list-panel" class="panel" style="display:none;">
      <h3>Lobby Players</h3>
      <ul id="players-list"></ul>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
